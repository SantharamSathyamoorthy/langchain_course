[project]
name = "langchain-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.5.2",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.2.0",
    "langchain-openai>=1.8.5",
    "langchain-pinecone>=0.2.13",
    "langchain-text-splitters>=1.2.0",

    "python-dotenv>=1.2.4",

]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "isort>=9.0.2",
]

[tool.uv]
# llvmlite/numba >=0.45 ship no macOS x86_64 wheels; source build fails
constraint-dependencies = ["llvmlite<0.45", "numba<0.62"]
